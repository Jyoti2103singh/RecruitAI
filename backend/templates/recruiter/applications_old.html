<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Applications | AIScreen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  :root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--border:rgba(255,255,255,0.07);--purple:#7c5cbf;--purple-bright:#9b7de8;--purple-glow:rgba(124,92,191,0.25);--text:#e8e8f0;--muted:#6b6b80;--success:#4ade80;--danger:#f87171;--warn:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;}
  .sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:fixed;left:0;top:0;bottom:0;}
  .logo{padding:0 20px 28px;font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--purple-bright);}
  .logo span{color:var(--text);}
  .nav-section{padding:0 12px;margin-bottom:8px;}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:0 8px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;text-decoration:none;transition:all 0.2s;margin-bottom:2px;}
  .nav-item:hover{background:var(--bg3);color:var(--text);}
  .nav-item.active{background:var(--purple-glow);color:var(--purple-bright);}
  .nav-item i{width:16px;text-align:center;font-size:13px;}
  .sidebar-bottom{margin-top:auto;padding:0 12px;}
  .logout-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--danger);font-size:13.5px;text-decoration:none;transition:all 0.2s;width:100%;background:none;border:none;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{background:rgba(248,113,113,0.08);}
  .main{margin-left:220px;flex:1;padding:40px;}
  .page-header{margin-bottom:28px;}
  .page-header h1{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;}
  .page-header p{color:var(--muted);margin-top:6px;font-size:14px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .stat-val{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;margin-bottom:4px;}
  .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;}
  .stat-val.purple{color:var(--purple-bright);}.stat-val.green{color:var(--success);}.stat-val.red{color:var(--danger);}.stat-val.yellow{color:var(--warn);}
  .filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
  .filter-btn{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .filter-btn:hover{border-color:var(--purple);color:var(--purple-bright);}
  .filter-btn.active{background:var(--purple-glow);border-color:var(--purple);color:var(--purple-bright);}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
  .search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px 9px 34px;color:var(--text);font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;}
  .search-wrap input:focus{border-color:var(--purple);}
  .job-group{margin-bottom:32px;}
  .job-group-title{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;}
  .count{background:var(--purple-glow);color:var(--purple-bright);font-size:11px;padding:2px 9px;border-radius:12px;}
  .app-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:10px;display:flex;align-items:center;gap:16px;transition:border-color 0.2s;}
  .app-card:hover{border-color:var(--purple);}
  .app-avatar{width:42px;height:42px;border-radius:10px;background:var(--purple-glow);display:flex;align-items:center;justify-content:center;color:var(--purple-bright);font-size:16px;font-weight:700;flex-shrink:0;}
  .app-info{flex:1;}
  .app-name{font-weight:600;font-size:15px;margin-bottom:3px;}
  .app-meta{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;}
  .app-meta span{display:flex;align-items:center;gap:5px;}
  .app-cover{font-size:12.5px;color:var(--muted);margin-top:6px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px;}
  .score-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;border:2px solid;}
  .score-high{border-color:var(--success);color:var(--success);background:rgba(74,222,128,0.08);}
  .score-mid{border-color:var(--warn);color:var(--warn);background:rgba(251,191,36,0.08);}
  .score-low{border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,0.08);}
  .status-badge{font-size:11px;padding:4px 11px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .status-pending{background:rgba(251,191,36,0.1);color:var(--warn);border:1px solid rgba(251,191,36,0.25);}
  .status-shortlisted{background:rgba(74,222,128,0.1);color:var(--success);border:1px solid rgba(74,222,128,0.25);}
  .status-rejected{background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.25);}
  .app-actions{display:flex;gap:8px;flex-shrink:0;}
  .btn-sm{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .btn-accept{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3);color:var(--success);}
  .btn-accept:hover{background:rgba(74,222,128,0.2);}
  .btn-reject{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--danger);}
  .btn-reject:hover{background:rgba(248,113,113,0.15);}
  .btn-view{background:var(--bg3);border:1px solid var(--border);color:var(--muted);}
  .btn-view:hover{border-color:var(--purple);color:var(--purple-bright);}
  .empty-state{text-align:center;padding:60px 24px;color:var(--muted);}
  .empty-state i{font-size:40px;display:block;margin-bottom:14px;opacity:0.2;}
  .spinner{display:flex;justify-content:center;padding:60px;color:var(--muted);}
  .spinner i{animation:spin 1s linear infinite;font-size:28px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 0.25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:520px;transform:translateY(20px);transition:transform 0.25s;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-title{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;margin-bottom:20px;}
  .detail-row{display:flex;gap:8px;margin-bottom:10px;font-size:13.5px;}
  .detail-label{color:var(--muted);min-width:110px;}
  .detail-val{color:var(--text);font-weight:500;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;border-top:1px solid var(--border);padding-top:20px;}
  .btn{padding:10px 22px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-success{background:rgba(74,222,128,0.15);border:1px solid rgba(74,222,128,0.3);color:var(--success);}
  .btn-danger{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--danger);}
  .toast{position:fixed;bottom:32px;right:32px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:13.5px;transform:translateY(80px);opacity:0;transition:all 0.35s;z-index:999;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success i{color:var(--success);}.toast.error i{color:var(--danger);}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">AI<span>Screen</span></div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <a href="/dashboard" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
    <a href="/screen" class="nav-item"><i class="fas fa-upload"></i> Screen Resume</a>
    <a href="/candidates" class="nav-item"><i class="fas fa-users"></i> Candidates</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Tools</div>
    <a href="/ai-interviewer" class="nav-item"><i class="fas fa-robot"></i> AI Interviewer</a>
    <a href="/analytics" class="nav-item"><i class="fas fa-chart-pie"></i> Analytics</a>
    <a href="/history" class="nav-item"><i class="fas fa-history"></i> History</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Jobs</div>
    <a href="/recruiter/post-job" class="nav-item"><i class="fas fa-briefcase"></i> Post a Job</a>
    <a href="/recruiter/applications" class="nav-item active"><i class="fas fa-inbox"></i> Applications</a>
  </div>
  <div class="sidebar-bottom">
    <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>
<main class="main">
  <div class="page-header">
    <h1>Applications</h1>
    <p>Review and manage jobseeker applications for your listings</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val purple" id="statTotal">-</div><div class="stat-label">Total Applications</div></div>
    <div class="stat-card"><div class="stat-val yellow" id="statPending">-</div><div class="stat-label">Pending Review</div></div>
    <div class="stat-card"><div class="stat-val green" id="statShortlisted">-</div><div class="stat-label">Shortlisted</div></div>
    <div class="stat-card"><div class="stat-val red" id="statRejected">-</div><div class="stat-label">Rejected</div></div>
  </div>
  <div class="filters">
    <div class="search-wrap"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by applicant name..."/></div>
    <button class="filter-btn active" id="f-all">All</button>
    <button class="filter-btn" id="f-pending">Pending</button>
    <button class="filter-btn" id="f-shortlisted">Shortlisted</button>
    <button class="filter-btn" id="f-rejected">Rejected</button>
  </div>
  <div id="appsList"><div class="spinner"><i class="fas fa-spinner"></i></div></div>
</main>
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-title" id="modalName">Applicant Details</div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-danger" id="modalRejectBtn">Reject</button>
      <button class="btn btn-success" id="modalAcceptBtn">Shortlist</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>
<script>
var allApps=[];var currentFilter='all';
function scoreClass(s){return s>=70?'score-high':s>=40?'score-mid':'score-low';}
function statusBadge(s){s=s||'pending';return '<span class="status-badge status-'+s+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</span>';}
function updateStats(){
  document.getElementById('statTotal').textContent=allApps.length;
  document.getElementById('statPending').textContent=allApps.filter(function(a){return !a.status||a.status==='pending';}).length;
  document.getElementById('statShortlisted').textContent=allApps.filter(function(a){return a.status==='shortlisted';}).length;
  document.getElementById('statRejected').textContent=allApps.filter(function(a){return a.status==='rejected';}).length;
}
function renderAll(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=allApps.filter(function(a){
    return (!q||(a.applicant||'').toLowerCase().indexOf(q)!==-1)&&(currentFilter==='all'||(a.status||'pending')===currentFilter);
  });
  var groups={};
  filtered.forEach(function(a){var k=a.job_id+'||'+(a.job_title||'Unknown Job');if(!groups[k])groups[k]=[];groups[k].push(a);});
  var container=document.getElementById('appsList');
  if(!filtered.length){container.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><p>No applications found</p></div>';return;}
  var html='';
  Object.keys(groups).forEach(function(key){
    var parts=key.split('||');var apps=groups[key];
    html+='<div class="job-group"><div class="job-group-title"><i class="fas fa-briefcase"></i> '+parts[1]+' <span class="count">'+apps.length+'</span></div>';
    apps.forEach(function(a){
      var score=a.ats_score||0;var init=a.applicant?a.applicant[0].toUpperCase():'?';
      html+='<div class="app-card"><div class="app-avatar">'+init+'</div><div class="app-info"><div class="app-name">'+(a.applicant||'Unknown')+'</div><div class="app-meta"><span><i class="fas fa-calendar"></i>'+(a.created_at||'').slice(0,10)+'</span>'+(a.portfolio_url?'<span><i class="fas fa-link"></i><a href="'+a.portfolio_url+'" target="_blank" style="color:var(--purple-bright)">Portfolio</a></span>':'')+'</div>'+(a.cover_note?'<div class="app-cover">"'+a.cover_note+'"</div>':'')+'</div><div class="score-circle '+scoreClass(score)+'">'+score+'</div>'+statusBadge(a.status)+'<div class="app-actions"><button class="btn-sm btn-view" onclick="viewDetail('+a.id+')"><i class="fas fa-eye"></i></button><button class="btn-sm btn-accept" onclick="updateStatus('+a.id+','shortlisted')"><i class="fas fa-check"></i></button><button class="btn-sm btn-reject" onclick="updateStatus('+a.id+','rejected')"><i class="fas fa-times"></i></button></div></div>';
    });
    html+='</div>';
  });
  container.innerHTML=html;
}
function viewDetail(id){
  var a=null;for(var i=0;i<allApps.length;i++){if(allApps[i].id===id){a=allApps[i];break;}}if(!a)return;
  document.getElementById('modalName').textContent=a.applicant||'Applicant';
  var score=a.ats_score||0;var sc=score>=70?'var(--success)':score>=40?'var(--warn)':'var(--danger)';
  document.getElementById('modalBody').innerHTML='<div class="detail-row"><div class="detail-label">Job Applied</div><div class="detail-val">'+(a.job_title||'N/A')+'</div></div><div class="detail-row"><div class="detail-label">ATS Score</div><div class="detail-val" style="color:'+sc+'">'+score+' / 100</div></div><div class="detail-row"><div class="detail-label">Status</div><div class="detail-val">'+statusBadge(a.status)+'</div></div><div class="detail-row"><div class="detail-label">Applied On</div><div class="detail-val">'+(a.created_at||'').slice(0,10)+'</div></div>'+(a.cover_note?'<div class="detail-row"><div class="detail-label">Cover Note</div><div class="detail-val">'+a.cover_note+'</div></div>':'')+(a.portfolio_url?'<div class="detail-row"><div class="detail-label">Portfolio</div><div class="detail-val"><a href="'+a.portfolio_url+'" target="_blank" style="color:var(--purple-bright)">'+a.portfolio_url+'</a></div></div>':'');
  document.getElementById('modalAcceptBtn').onclick=function(){updateStatus(id,'shortlisted');closeModal();};
  document.getElementById('modalRejectBtn').onclick=function(){updateStatus(id,'rejected');closeModal();};
  document.getElementById('detailModal').classList.add('open');
}
function closeModal(){document.getElementById('detailModal').classList.remove('open');}
function updateStatus(id,status){
  fetch('/api/applications/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.success){for(var i=0;i<allApps.length;i++){if(allApps[i].id===id){allApps[i].status=status;break;}}updateStats();renderAll();showToast(status==='shortlisted'?'Shortlisted!':'Rejected',status==='shortlisted'?'success':'error');}
    else{showToast('Failed: '+(data.error||'unknown'),'error');}
  }).catch(function(){showToast('Network error','error');});
}
function showToast(msg,type){
  var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;
  t.className='toast '+(type||'success')+' show';
  t.querySelector('i').className=type==='error'?'fas fa-exclamation-circle':'fas fa-check-circle';
  setTimeout(function(){t.classList.remove('show');},3000);
}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderAll();}
document.getElementById('f-all').onclick=function(){setFilter('all',this);};
document.getElementById('f-pending').onclick=function(){setFilter('pending',this);};
document.getElementById('f-shortlisted').onclick=function(){setFilter('shortlisted',this);};
document.getElementById('f-rejected').onclick=function(){setFilter('rejected',this);};
document.getElementById('searchInput').oninput=renderAll;
fetch('/api/recruiter/applications')
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){document.getElementById('appsList').innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error: '+data.error+'</p></div>';return;}
    allApps=data;updateStats();renderAll();
  }).catch(function(){document.getElementById('appsList').innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Could not connect. Is app.py running?</p></div>';});
</script>
</body>
</html>
