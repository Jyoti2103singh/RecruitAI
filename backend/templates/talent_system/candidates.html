<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Candidates - RecruitAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gray-950 text-white min-h-screen">

<!-- NAV - FIXED -->
<nav class="fixed left-0 top-0 h-full w-[220px] bg-gray-900 border-r border-gray-800 flex flex-col py-8 px-4 z-50">
    <h1 class="text-purple-400 font-bold text-lg mb-8">RecruitAI</h1>
    <a href="/dashboard" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">📊 Dashboard</a>
    <a href="/upload" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">📤 Upload Resume</a>
    <a href="/screening" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">🔍 AI Screening</a>
    <a href="/results" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">📋 Results</a>
    <a href="/candidates" class="flex items-center gap-3 text-white px-3 py-2 rounded-lg bg-purple-500/20 border-l-4 border-purple-400 mb-1">👥 Candidates</a>
    <a href="/compare-candidates" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">⚖️ Compare</a>
    <a href="/history" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">🕐 History</a>
    <a href="/analytics" class="flex items-center gap-3 text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 mb-1">📈 Analytics</a>
    <a href="/logout" class="flex items-center gap-3 text-red-400 hover:text-red-300 px-3 py-2 rounded-lg hover:bg-red-500/10 mt-auto">🚪 Logout</a>
</nav>

<!-- MAIN -->
<main class="ml-[220px] p-8">

    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold">All Candidates</h1>
            <p class="text-gray-400 mt-1">Manage your talent pool</p>
        </div>
        <a href="/upload" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-xl font-bold transition-all">
            + Add Candidate
        </a>
    </div>

    <!-- ERROR BOX -->
    <div id="errorBox"></div>

    <!-- TABLE -->
    <div class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden">
        <table class="w-full">
            <thead>
                <tr class="bg-purple-600/20 border-b border-gray-800">
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Name</th>
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Email</th>
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Score</th>
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Status</th>
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Skills</th>
                    <th class="text-left px-6 py-4 text-purple-300 font-semibold">Action</th>
                </tr>
            </thead>
            <tbody id="candidatesTable">
                <tr>
                    <td colspan="6" class="text-center py-12 text-gray-500">
                        ⏳ Loading candidates...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<script>
async function loadCandidates() {
    try {
        const response = await fetch('/api/candidates');
        if (!response.ok) {
            if (response.status === 401) window.location.href = '/login';
            throw new Error('Failed to load candidates');
        }

        const data = await response.json();
        const tbody = document.getElementById('candidatesTable');

        if (!data.candidates || data.candidates.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-16">
                        <p class="text-4xl mb-3">👥</p>
                        <p class="text-gray-400 font-bold text-lg">No candidates yet</p>
                        <p class="text-gray-600 text-sm mt-1">Upload resumes to add candidates</p>
                        <a href="/upload" class="inline-block mt-4 bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-xl text-sm font-bold transition-all">Upload Resume</a>
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = data.candidates.map(c => {
            const scoreBg = c.score >= 80
                ? 'bg-green-500/20 text-green-400 border border-green-500/30'
                : c.score >= 60
                ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'
                : 'bg-red-500/20 text-red-400 border border-red-500/30';

            const statusBg = c.status === 'hired'
                ? 'bg-green-500/20 text-green-400'
                : c.status === 'shortlisted'
                ? 'bg-blue-500/20 text-blue-400'
                : 'bg-red-500/20 text-red-400';

            return `
                <tr class="border-b border-gray-800 hover:bg-white/5 transition-all">
                    <td class="px-6 py-4 font-bold">${c.name}</td>
                    <td class="px-6 py-4 text-gray-400 text-sm">${c.email}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${scoreBg}">
                            ${c.score ? c.score.toFixed(1) : 'N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${statusBg}">
                            ${c.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-gray-400 text-sm">
                        ${c.skills ? c.skills.slice(0,2).join(', ') : 'N/A'}
                    </td>
                    <td class="px-6 py-4">
                        <a href="/candidate-profile?id=${c.id}"
                           class="text-purple-400 hover:text-purple-300 font-bold text-sm hover:underline">
                            View →
                        </a>
                    </td>
                </tr>`;
        }).join('');

    } catch (error) {
        document.getElementById('errorBox').innerHTML = `
            <div class="bg-red-500/20 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-4">
                ⚠️ Error: ${error.message}
            </div>`;
    }
}

window.addEventListener('load', loadCandidates);
</script>

</body>
</html>
