<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Requirements - RecruitAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 40px; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .step-indicator { color: #999; margin-bottom: 20px; font-size: 14px; font-weight: 600; }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #999; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #667eea; }
        textarea { resize: vertical; min-height: 100px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .button-group { display: flex; gap: 15px; margin-top: 30px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .progress { display: none; margin-top: 20px; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #667eea; width: 0%; transition: width 0.3s; }
        .skills-input { font-size: 12px; color: #999; }
        .skill-tag { display: inline-block; background: #667eea; color: white; padding: 5px 10px; border-radius: 20px; margin: 5px 5px 5px 0; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="step-indicator">Step 2 of 2</div>
    <h1>📋 Job Requirements</h1>
    <p class="subtitle">Provide job details for screening comparison</p>
    
    <div id="message"></div>
    
    <form id="jobForm">
        <div class="form-group">
            <label>Job Title *</label>
            <input type="text" id="jobTitle" placeholder="e.g., Senior Software Developer" required>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>Experience Level (Years) *</label>
                <input type="number" id="experienceLevel" min="0" max="50" placeholder="e.g., 5" required>
            </div>
            
            <div class="form-group">
                <label>Preferred Salary Range</label>
                <input type="text" id="salaryRange" placeholder="e.g., $100k-$150k">
            </div>
        </div>
        
        <div class="form-group">
            <label>Required Skills (comma-separated) *</label>
            <input type="text" id="skillsInput" placeholder="e.g., Python, Flask, PostgreSQL, Docker" required>
            <small class="skills-input">Tip: Add skills separated by commas</small>
            <div id="skillsTags" style="margin-top: 10px;"></div>
        </div>
        
        <div class="form-group">
            <label>Job Description</label>
            <textarea id="description" placeholder="Enter detailed job description (optional)"></textarea>
        </div>
        
        <div class="form-group">
            <label>Department</label>
            <input type="text" id="department" placeholder="e.g., Engineering">
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="button-group">
            <button type="button" class="btn-secondary" onclick="history.back()">← Back</button>
            <button type="submit" class="btn-primary" id="submitBtn">Screen Resume</button>
        </div>
    </form>
</div>

<script>
async function handleJobFormSubmit(e) {
    e.preventDefault();
    
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const resumeId = sessionStorage.getItem('resumeId');
    
    if (!resumeId) {
        messageBox.className = 'message error';
        messageBox.textContent = '❌ Resume ID not found. Please upload resume first.';
        return;
    }
    
    try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';
        document.getElementById('progress').style.display = 'block';
        
        // Parse skills
        const skills = document.getElementById('skillsInput').value
            .split(',')
            .map(s => s.trim())
            .filter(s => s);
        
        // Step 1: Create job requirements
        const jobResponse = await fetch('/api/job-requirements', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                job_title: document.getElementById('jobTitle').value,
                required_skills: skills.join(','),
                experience_level: parseInt(document.getElementById('experienceLevel').value),
                description: document.getElementById('description').value,
                department: document.getElementById('department').value,
                salary_range: document.getElementById('salaryRange').value
            })
        });
        
        const jobData = await jobResponse.json();
        if (!jobData.success) throw new Error(jobData.error || 'Failed to create job requirements');
        
        const jobId = jobData.job_id;
        
        // Step 2: Run screening
        document.getElementById('progressFill').style.width = '50%';
        
        const screeningResponse = await fetch('/api/screen-resume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                resume_id: resumeId,
                job_id: jobId
            })
        });
        
        const screeningData = await screeningResponse.json();
        if (!screeningData.success) throw new Error(screeningData.error || 'Screening failed');
        
        document.getElementById('progressFill').style.width = '100%';
        
        messageBox.className = 'message success';
        messageBox.textContent = '✅ Screening complete! Redirecting...';
        
        // Clear session and redirect to results
        sessionStorage.removeItem('resumeId');
        setTimeout(() => {
            window.location.href = `/results?screening_id=${screeningData.screening_id}`;
        }, 1500);
    } catch (error) {
        messageBox.className = 'message error';
        messageBox.textContent = '❌ Error: ' + error.message;
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Screen Resume';
        document.getElementById('progress').style.display = 'none';
        document.getElementById('progressFill').style.width = '0%';
    }
}

// Update skills tags
document.getElementById('skillsInput').addEventListener('change', function() {
    const skills = this.value.split(',').map(s => s.trim()).filter(s => s);
    const tagsDiv = document.getElementById('skillsTags');
    tagsDiv.innerHTML = skills.map((skill, i) => 
        `<span class="skill-tag">${skill}</span>`
    ).join('');
});

// Form submission
document.getElementById('jobForm').addEventListener('submit', handleJobFormSubmit);

// Show resume ID confirmation (for debugging)
window.addEventListener('load', () => {
    const resumeId = sessionStorage.getItem('resumeId');
    if (!resumeId) {
        document.getElementById('message').className = 'message error';
        document.getElementById('message').textContent = '⚠️ Warning: Resume not properly uploaded. Please go back and upload again.';
    }
});
</script>

</body>
</html>
