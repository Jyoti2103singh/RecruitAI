<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | AIScreen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
  :root {
    --bg: #0d0f14; --surface: #151820; --surface2: #1c2030;
    --border: #252a38; --accent: #4fffb0; --accent2: #7c6fff;
    --text: #e8eaf0; --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(79,255,176,0.05) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(124,111,255,0.05) 0%, transparent 60%);
  }
  .container { width: 100%; max-width: 480px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
  .logo h1 span { color: var(--text); }
  .logo p { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; margin-top: 4px; }

  .role-toggle {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; margin-bottom: 20px; gap: 4px;
  }
  .role-btn {
    padding: 12px; border-radius: 8px; border: none;
    background: transparent; color: var(--muted);
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .role-btn.active { background: var(--surface2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .role-btn.active.recruiter { color: var(--accent); }
  .role-btn.active.jobseeker { color: var(--accent2); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
  .recruiter-mode .card-title { color: var(--accent); }
  .jobseeker-mode .card-title { color: var(--accent2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'DM Mono', monospace; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 11px 14px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: rgba(79,255,176,0.4); }
  .jobseeker-mode input:focus { border-color: rgba(124,111,255,0.4); }
  select option { background: var(--surface2); }

  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; margin-top: 6px;
  }
  .btn-recruiter { background: var(--accent); color: #0d0f14; }
  .btn-recruiter:hover { background: #3de89a; }
  .btn-jobseeker { background: var(--accent2); color: #fff; }
  .btn-jobseeker:hover { background: #6a5ee0; }

  .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; font-family: 'DM Mono', monospace; }
  .alert-error { background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.2); }
  .alert-success { background: rgba(79,255,176,0.1); color: var(--accent); border: 1px solid rgba(79,255,176,0.2); }

  .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .jobseeker-mode .footer-link a { color: var(--accent2); }

  /* Jobseeker extra fields */
  .jobseeker-fields { display: none; }
  .jobseeker-mode .jobseeker-fields { display: block; }
  .recruiter-fields { display: block; }
  .jobseeker-mode .recruiter-fields { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>AI<span>Screen</span></h1>
    <p>Create your account</p>
  </div>

  <div class="role-toggle">
    <button class="role-btn active recruiter" onclick="setRole('recruiter')">
      <span>💼</span> Recruiter
    </button>
    <button class="role-btn jobseeker" onclick="setRole('jobseeker')">
      <span>🎓</span> Job Seeker
    </button>
  </div>

  <div class="card recruiter-mode" id="signup-card">
    <div class="card-title" id="card-title">Create Recruiter Account</div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST" action="/signup">
      <input type="hidden" name="role" id="role-input" value="recruiter">

      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="fullname" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="username" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" placeholder="Phone number">
        </div>
      </div>

      <!-- Recruiter only fields -->
      <div class="recruiter-fields">
        <div class="form-group">
          <label>Company / Organization</label>
          <input type="text" name="address" placeholder="Company name or address">
        </div>
      </div>

      <!-- Jobseeker only fields -->
      <div class="jobseeker-fields">
        <div class="form-row">
          <div class="form-group">
            <label>Current Role</label>
            <input type="text" name="current_role" placeholder="e.g. Frontend Dev">
          </div>
          <div class="form-group">
            <label>Experience</label>
            <select name="experience">
              <option value="fresher">Fresher</option>
              <option value="1-2">1-2 years</option>
              <option value="3-5">3-5 years</option>
              <option value="5+">5+ years</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address" placeholder="Your city / address">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" placeholder="Confirm" required>
        </div>
      </div>

      <button type="submit" class="btn btn-recruiter" id="signup-btn">Create Recruiter Account</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>
</div>

<script>
  function setRole(role) {
    const card = document.getElementById('signup-card');
    const title = document.getElementById('card-title');
    const btn = document.getElementById('signup-btn');
    const roleInput = document.getElementById('role-input');
    const btns = document.querySelectorAll('.role-btn');

    btns.forEach(b => b.classList.remove('active'));
    document.querySelector('.' + role).classList.add('active');
    roleInput.value = role;

    if (role === 'recruiter') {
      card.className = 'card recruiter-mode';
      title.textContent = 'Create Recruiter Account';
      btn.className = 'btn btn-recruiter';
      btn.textContent = 'Create Recruiter Account';
    } else {
      card.className = 'card jobseeker-mode';
      title.textContent = 'Create Job Seeker Account';
      btn.className = 'btn btn-jobseeker';
      btn.textContent = 'Create Job Seeker Account';
    }
  }
</script>
</body>
</html>
